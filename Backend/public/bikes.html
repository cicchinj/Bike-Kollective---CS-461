
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Kollective</title>
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/bikes.html">Bikes</a>
    </nav>

    <h2>Bikes</h2>
    
    <!-- Create a New Bike-->
    <h2>Add a New Bike</h2>
    <form id="addBikeForm" onsubmit="addBike(event)">
        <input type="text" id="brand" placeholder="Brand" required>
        <input type="text" id="model" placeholder="Model" required>
        <input type="text" id="type" placeholder="Type" required>
        <input type="text" id="condition" placeholder="Condition" required>
        <input type="text" id="status" placeholder="Status" required>

        <button type="submit">Add Bike</button>
    </form>

    <!-- Show Bikes -->
     <h2>Show Bikes</h2>
    <button onclick="loadBikes()">Display Bikes</button>
    <pre id="bikeList"></pre>


    <footer>
        <p>Cicchinelli 2026</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
